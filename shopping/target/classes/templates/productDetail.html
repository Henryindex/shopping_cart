<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - 商品詳細資訊'">商品詳細資訊</title>
    <style>
        /* 全局與背景設定 (與列表頁保持一致) */
        body { font-family: sans-serif; padding: 20px; background-color: #f4f6f7; color: #333; }

        /* === 新增：頂部導覽列樣式 === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 15px;
        }
        .header h1 { margin: 0; color: #2c3e50; }
        .top-nav { display: flex; gap: 15px; }
        .nav-btn {
            text-decoration: none;
            color: #34495e;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 0.9em;
            transition: all 0.2s ease-in-out;
        }
        .nav-btn:hover {
            background-color: #34495e;
            color: white;
            border-color: #34495e;
        }

        /* === 商品卡片樣式 === */
        .product-card {
            background-color: white; /* 加上白底凸顯卡片 */
            border: 1px solid #e0e0e0;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto; /* 讓卡片在畫面中置中 */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .price { color: #e74c3c; font-size: 1.5em; font-weight: bold; }
        .stock { color: #27ae60; font-weight: bold; }
        .out-of-stock { color: #7f8c8d; font-style: italic; font-weight: bold; }

        /* 表單與輸入框樣式優化 */
        .quantity-group { margin: 15px 0; }
        .quantity-group input { padding: 8px; width: 80px; font-size: 1em; text-align: center; border: 1px solid #ccc; border-radius: 4px; }

        /* 按鈕群組排版 */
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }

        /* 按鈕共用樣式 */
        .btn { flex: 1; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.05em; font-weight: bold; transition: background-color 0.2s; }

        /* 加入購物車按鈕 (藍色) */
        .btn-add-cart { background-color: #3498db; color: white; }
        .btn-add-cart:hover { background-color: #2980b9; }

        /* 快速購買按鈕 (橘色/強調色) */
        .btn-quick-buy { background-color: #e67e22; color: white; }
        .btn-quick-buy:hover { background-color: #d35400; }

        .btn-disabled { background-color: #bdc3c7; color: white; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <h1>線上購物商城</h1>
    <nav class="top-nav">
        <a th:href="@{/}" class="nav-btn">🏠 返回首頁</a>
        <a th:href="@{/cart}" class="nav-btn">🛒 前往購物車</a>
        <a th:href="@{/user/login}" class="nav-btn">👤 前往登入</a>
    </nav>
</div>

<div th:if="${product != null}" class="product-card">

    <h1 th:text="${product.name}" style="margin-top: 0; color: #2c3e50;">預設商品名稱</h1>
    <p>售價： <span class="price" th:text="${'$' + product.price}">$0</span></p>
    <p class="stock">目前庫存： <span th:text="${product.stockQuantity}">0</span> 件</p>

    <hr style="border: 0; border-top: 1px solid #ecf0f1; margin: 20px 0;">

    <div th:if="${product.isActive and product.stockQuantity > 0}">

        <form method="post">
            <input type="hidden" name="productId" th:value="${product.id}" />
            <input type="hidden" name="price" th:value="${product.price}" />

            <div class="quantity-group">
                <label for="quantity">購買數量：</label>
                <input type="number" id="quantity" name="quantity"
                       value="1" min="1" th:max="${product.stockQuantity}" required />
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn btn-add-cart"
                        th:formaction="@{/cart/items}">加入購物車</button>

                <button type="submit" class="btn btn-quick-buy"
                        th:formaction="@{/cart/quick-buy}">快速購買</button>
            </div>
        </form>

    </div>

    <div th:unless="${product.isActive and product.stockQuantity > 0}">
        <p class="out-of-stock">很抱歉，此商品目前缺貨或已下架。</p>
        <div class="action-buttons">
            <button class="btn btn-disabled" disabled>無法購買</button>
        </div>
    </div>

</div>

<div th:if="${product == null}" style="text-align: center; padding: 50px;">
    <h2 style="color: #7f8c8d;">找不到該商品資訊。</h2>
    <a th:href="@{/products}" class="nav-btn" style="display: inline-block; margin-top: 15px;">返回商品列表</a>
</div>

</body>
</html>
