<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會員註冊 - 線上購物商城</title>
    <style>
        /* 全局與背景設定 */
        body { font-family: sans-serif; background-color: #f4f6f7; padding: 20px; color: #333; margin: 0; }

        /* 頂部導覽列 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 2px solid #34495e; padding-bottom: 15px; padding-left: 20px; padding-right: 20px; }
        .header h1 { margin: 0; color: #2c3e50; }
        .top-nav { display: flex; gap: 15px; }
        .nav-btn { text-decoration: none; color: #34495e; font-weight: bold; padding: 8px 16px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 0.9em; transition: all 0.2s ease-in-out; }
        .nav-btn:hover { background-color: #34495e; color: white; border-color: #34495e; }

        /* 註冊表單卡片 */
        .register-container { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .register-container h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 30px; }

        /* 錯誤訊息區塊 */
        .alert-error { background-color: #fdeaea; color: #e74c3c; padding: 15px; border-radius: 4px; margin-bottom: 25px; border: 1px solid #f5c6c6; font-weight: bold; text-align: center; }

        /* 表單群組與輸入框 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        .form-group input { width: 100%; padding: 12px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #3498db; outline: none; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }

        /* 按鈕樣式 */
        .btn-submit { width: 100%; background-color: #2ecc71; color: white; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #27ae60; }

        .login-link { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .login-link a { color: #3498db; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="header">
    <h1>線上購物商城</h1>
    <nav class="top-nav">
        <a th:href="@{/}" class="nav-btn">🏠 返回首頁</a>
        <a th:href="@{/user/login}" class="nav-btn">👤 前往登入</a>
    </nav>
</div>

<div class="register-container">
    <h2>會員註冊</h2>

    <div th:if="${error != null}" class="alert-error">
        ⚠️ <span th:text="${error}">這裡會顯示後端傳來的錯誤訊息 (例如：帳號已被使用、兩次密碼不一致)</span>
    </div>

    <form th:action="@{/user/register}" method="post">

        <div class="form-group">
            <label for="username">會員帳號 (名稱)</label>
            <input type="text" id="username" name="username" placeholder="請輸入您的登入帳號" required th:value="${userDTO?.username}" />
        </div>

        <div class="form-group">
            <label for="fullName">真實姓名</label>
            <input type="text" id="fullName" name="fullName" placeholder="請輸入您的真實姓名" required th:value="${userDTO?.fullName}" />
        </div>

        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" placeholder="請設定6位數以上的密碼" required minlength="6" />
        </div>

        <div class="form-group">
            <label for="confirmPassword">密碼確認</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入密碼" required minlength="6" />
        </div>

        <div class="form-group">
            <label for="email">電子信箱</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required th:value="${userDTO?.email}" />
        </div>

        <div class="form-group">
            <label for="phone">手機號碼</label>
            <input type="tel" id="phone" name="phone" placeholder="0912345678" required pattern="09\d{8}" title="請輸入有效的手機號碼 (09開頭，共10碼)" th:value="${userDTO?.phone}" />
        </div>

        <button type="submit" class="btn-submit">立即註冊</button>
    </form>

    <div class="login-link">
        已經有帳號了嗎？ <a th:href="@{/login/login}">點此登入</a>
    </div>
</div>

</body>
</html>
