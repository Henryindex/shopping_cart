<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>商品商城 - 瀏覽所有商品</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f6f7; color: #333; }

    /* 修改點 1：將 Header 設為 Flex 佈局，讓左右元素對齊 */
    .header {
        display: flex;
        justify-content: space-between; /* 標題靠左，導覽列靠右 */
        align-items: center;            /* 垂直置中 */
        margin-bottom: 30px;
        border-bottom: 2px solid #34495e;
        padding-bottom: 15px;
    }

    .header h1 { margin: 0; }

    /* 修改點 2：右上角導覽按鈕樣式 */
    .top-nav { display: flex; gap: 15px; }
    .nav-btn {
        text-decoration: none;
        color: #34495e;
        font-weight: bold;
        padding: 8px 16px;
        border: 1px solid #bdc3c7;
        border-radius: 4px;
        font-size: 0.9em;
        transition: all 0.2s ease-in-out;
    }
    .nav-btn:hover {
        background-color: #34495e;
        color: white;
        border-color: #34495e;
    }

    /* 響應式網格佈局 */
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
    }

    /* 商品卡片樣式 */
    .product-card {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .product-name { font-size: 1.25em; margin: 0 0 10px 0; color: #2c3e50; }
    .price { color: #e74c3c; font-size: 1.2em; font-weight: bold; margin-bottom: 10px; }
    .stock-status { font-size: 0.9em; margin-bottom: 20px; }
    .in-stock { color: #27ae60; }
    .out-of-stock { color: #95a5a6; font-style: italic; }

    /* 操作按鈕樣式 */
    .actions { display: flex; gap: 10px; margin-top: auto; }
    .btn {
        flex: 1; text-align: center; padding: 10px;
        border: none; border-radius: 4px; text-decoration: none;
        font-size: 0.9em; font-weight: bold; cursor: pointer;
    }
    .btn-detail { background-color: #34495e; color: white; }
    .btn-detail:hover { background-color: #2c3e50; }
    .btn-quick-add { background-color: #2ecc71; color: white; }
    .btn-quick-add:hover { background-color: #27ae60; }
    .btn-disabled { background-color: #bdc3c7; color: #7f8c8d; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 50px; color: #7f8c8d; }
  </style>
</head>
<body>

<div class="header">
  <h1>線上購物商城</h1>

  <nav class="top-nav">
    <a th:href="@{/}" class="nav-btn">🏠 返回首頁</a>
    <a th:href="@{/cart/detail}" class="nav-btn">🛒 前往購物車</a>
    <a th:href="@{/login/login}" class="nav-btn">👤 前往登入</a>
  </nav>
</div>

<div th:if="${#lists.isEmpty(products)}" class="empty-state">
  <h2>目前沒有任何上架商品，請稍後再試。</h2>
</div>

<div th:unless="${#lists.isEmpty(products)}" class="product-grid">

  <div th:each="product : ${products}" class="product-card">

    <div>
      <h2 class="product-name" th:text="${product.name}">預設商品名稱</h2>

      <p class="price" th:text="${'$' + product.price}">$0</p>

      <p class="stock-status">
        狀態：
        <span th:if="${product.isActive and product.stockQuantity > 0}" class="in-stock">
                        有庫存 (<span th:text="${product.stockQuantity}">0</span>)
                    </span>
        <span th:unless="${product.isActive and product.stockQuantity > 0}" class="out-of-stock">
                        已售罄 / 下架
                    </span>
      </p>
    </div>

    <div class="actions">
      <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-detail">查看詳情</a>

      <form th:if="${product.isActive and product.stockQuantity > 0}"
            th:action="@{/cart/items}" method="post" style="flex: 1; display: flex;">

        <input type="hidden" name="productId" th:value="${product.id}" />
        <input type="hidden" name="quantity" value="1" />

      </form>

      <button th:unless="${product.isActive and product.stockQuantity > 0}"
              class="btn btn-disabled" disabled>補貨中</button>
    </div>

  </div>
</div>

</body>
</html>
