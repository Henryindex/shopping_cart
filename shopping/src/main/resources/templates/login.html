<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>商城入口 - 登入或訪客體驗</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #34495e; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1em; }

        /* 按鈕樣式 */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 1em; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-login { background-color: #3498db; color: white; }
        .btn-login:hover { background-color: #2980b9; }
        .btn-guest { background-color: #2ecc71; color: white; margin-bottom: 0; }
        .btn-guest:hover { background-color: #27ae60; }

        .divider { margin: 20px 0; border-top: 1px solid #e0e0e0; position: relative; }
        .divider-text { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #7f8c8d; font-size: 0.9em; }
        .error-msg { color: #e74c3c; margin-bottom: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>歡迎光臨線上商城</h2>
    <p style="color: #7f8c8d; margin-bottom: 25px;">請選擇您的登入方式</p>

    <div th:if="${errorMessage != null}" class="error-msg" th:text="${errorMessage}"></div>

    <form th:action="@{/login/login}" method="post">
        <div class="form-group">
            <label for="username">使用者名稱</label>
            <input type="text" id="username" name="username" placeholder="請輸入帳號" required />
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" placeholder="請輸入密碼" required />
        </div>
        <button type="submit" class="btn btn-login">會員登入</button>
    </form>

    <div class="divider">
        <span class="divider-text">或</span>
    </div>

    <form th:action="@{/login/guest}" method="post">
        <button type="submit" class="btn btn-guest">以訪客身份繼續</button>
    </form>
</div>

</body>
</html>
